sonar.projectKey=DimonBel_Document-editor
sonar.projectName=Document Editor
sonar.projectVersion=0.1.0

# Issue #234: backend/src no longer exists (it was deleted in the
# 44aacf40 refactor). Point at the actual service crates.
sonar.sources=\
  backend/room-service/src,\
  backend/doc-service/src,\
  backend/latex-service/src,\
  gateway/src,\
  packages/*/src,\
  frontend/src

sonar.tests=\
  backend/room-service/tests,\
  backend/doc-service/tests,\
  backend/latex-service/tests,\
  gateway/tests,\
  packages/*/tests,\
  frontend/src

sonar.sourceEncoding=UTF-8

sonar.rust.file.suffixes=.rs
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx

sonar.exclusions=\
  **/target/**,\
  frontend/node_modules/**,\
  frontend/dist/**,\
  **/*.min.js,\
  **/Cargo.lock

sonar.coverage.exclusions=\
  backend/room-service/src/main.rs,\
  backend/doc-service/src/main.rs,\
  backend/latex-service/src/main.rs,\
  gateway/src/main.rs,\
  frontend/src/main.tsx