name: ed

# ----------------------------------------------------------------------------
# Document-editor refactor -- full local stack.
# Usage:  docker compose -f infra/docker-compose.yml up
# Stop:   docker compose -f infra/docker-compose.yml down
# Reset:  docker compose -f infra/docker-compose.yml down -v
# ----------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # ─────── stateful infra ───────
  postgres:
    image: postgres:16-alpine
    container_name: ed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ed
      POSTGRES_USER: ed
      POSTGRES_PASSWORD: ed
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ed -d ed"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks: [ednet]

  mongo:
    image: mongo:7
    container_name: ed-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks: [ednet]

  redis:
    image: redis:7-alpine
    container_name: ed-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks: [ednet]

  rabbit:
    image: rabbitmq:3.13-management-alpine
    container_name: ed-rabbit
    restart: unless-stopped
    ports: ["5672:5672", "15672:15672"]   # AMQP + management UI
    environment:
      RABBITMQ_VHOST: /
    volumes:
      - ./docker/rabbit/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbit/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [ednet]

  # ─────── Rust backend services ───────
  room-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.rust-service
      args: { SERVICE: room-service }
    image: ed/room-service:latest
    container_name: ed-room-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SERVICE_NAME: room-service
      DATABASE_URL: postgres://ed:ed@postgres:5432/ed
      MONGO_URL: mongodb://mongo:27017/ed
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbit:5672/
      RUST_LOG: info,room_service=debug,tower_http=info
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbit:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks: [ednet]

  doc-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.rust-service
      args: { SERVICE: doc-service }
    image: ed/doc-service:latest
    container_name: ed-doc-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SERVICE_NAME: doc-service
      DATABASE_URL: postgres://ed:ed@postgres:5432/ed
      MONGO_URL: mongodb://mongo:27017/ed
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbit:5672/
      RUST_LOG: info,doc_service=debug,tower_http=info
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbit:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks: [ednet]

  latex-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.rust-service
      args: { SERVICE: latex-service, INSTALL_TEX: "1" }
    image: ed/latex-service:latest
    container_name: ed-latex-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SERVICE_NAME: latex-service
      DATABASE_URL: postgres://ed:ed@postgres:5432/ed
      MONGO_URL: mongodb://mongo:27017/ed
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbit:5672/
      LATEX_ARTEFACTS_DIR: /var/lib/latex
      RUST_LOG: info,latex_service=debug,tower_http=info
    volumes: ["latex_artefacts:/var/lib/latex"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      rabbit:   { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks: [ednet]

  # ─────── Python gateway (reverse-proxy + auth) ───────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: ed/gateway:latest
    container_name: ed-gateway
    restart: unless-stopped
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      SERVICE_NAME: gateway
      DATABASE_URL: postgres://ed:ed@postgres:5432/ed
      MONGO_URL: mongodb://mongo:27017/ed
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbit:5672/
      JWT_ISSUER: ed-gateway
      JWT_AUDIENCE: ed-services
      JWKS_URL: http://gateway:8080/.well-known/jwks.json
      INTERNAL_SERVICE_TOKEN_SECRET: changeme
    ports: ["8080:8080"]
    depends_on:
      rabbit:       { condition: service_healthy }
      room-service: { condition: service_healthy }
      doc-service:  { condition: service_healthy }
      latex-service:{ condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8080/health').status_code==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [ednet]

  # ─────── Frontend SPA ───────
  frontend:
    build:
      context: ../frontend
    image: ed/frontend:latest
    container_name: ed-frontend
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on:
      gateway: { condition: service_healthy }
    logging: *default-logging
    networks: [ednet]

volumes:
  pg: {}
  mongo: {}
  redis: {}
  latex_artefacts: {}

networks:
  ednet:
    driver: bridge
    name: ed-net
