name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: ""
version-template: "$MAJOR.$MINOR.$PATCH"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
exclude-labels: ["skip-changelog"]
template: |
  ## Changes

  $CHANGES
categories:
  # Changelog categories (rendered in body, grouped by labels)
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Bug Fixes"
    labels: ["bug", "fix"]
  - title: "📝 Documentation"
    labels: ["docs", "documentation"]
  - title: "🔧 Maintenance"
    labels: ["chore", "refactor", "ci"]
  # Version resolver categories (no body, just bump semver).
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels: ["breaking", "major"]
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels: ["feature", "enhancement"]
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels: ["bug", "fix", "docs"]
  # Fallback when no other version-resolver category matches.
  - type: "version-resolver"
    semver-increment: "patch"