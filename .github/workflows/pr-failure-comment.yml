name: PR Failure Comment

on:
  workflow_run:
    workflows:
      - reviewdog
      - Semgrep
      - SonarQube Community
      - Release Drafter
      - PR Quality Gate
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  actions: read

jobs:
  notify-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post or update failure comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const runId = run.id;
            const runUrl = run.html_url;
            const workflowName = run.name;
            const branch = run.head_branch;
            const actor = run.triggering_actor?.login || run.actor?.login || 'unknown';
            const sha = run.head_sha.substring(0, 7);
            const prNumbers = (run.pull_requests || []).map(pr => pr.number);

            if (prNumbers.length === 0) {
              core.warning('No pull requests associated with this workflow run — skipping comment.');
              return;
            }

            let prTitle = '';
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumbers[0],
              });
              prTitle = pr.title;
            } catch (e) {
              core.warning(`Could not fetch PR metadata: ${e.message}`);
            }

            const marker = `<!-- pr-failure-comment:run=${runId} -->`;
            const body = [
              marker,
              '## ❌ Checks Failed',
              '',
              `**Workflow:** \`${workflowName}\`  `,
              `**PR:** #${prNumbers.join(', #')}${prTitle ? ` — ${prTitle}` : ''}  `,
              `**Branch:** \`${branch}\`  `,
              `**Commit:** \`${sha}\`  `,
              `**Triggered by:** @${actor}`,
              '',
              `📋 [View full run logs](${runUrl})`,
              '',
              '> Push a new commit or comment `/retry` on the failed workflow once the issue is fixed. This comment is updated in place, not duplicated.',
              '',
              '<details><summary>Run details</summary>',
              '',
              `- Run ID: \`${runId}\``,
              `- Event: \`${run.event}\``,
              `- Conclusion: \`${run.conclusion}\``,
              `- Created: \`${run.created_at}\``,
              '</details>',
              '',
              '---',
              '_Posted automatically by the PR Failure Comment workflow._',
            ].join('\n');

            for (const prNumber of prNumbers) {
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                const existing = comments.find(c => c.body && c.body.includes(marker));

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: existing.id, body,
                  });
                  core.info(`Updated existing failure comment on PR #${prNumber}.`);
                } else {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber, body,
                  });
                  core.info(`Posted new failure comment on PR #${prNumber}.`);
                }
              } catch (err) {
                core.warning(`Failed to comment on PR #${prNumber}: ${err.message}`);
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
