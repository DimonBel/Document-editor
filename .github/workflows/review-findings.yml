name: Review Findings → Issue

# When an AI / code-review bot posts a finding on a PR (review comment,
# top-level PR comment, or submitted review), open a tracker issue so
# the finding doesn't get buried in the conversation.
#
# One tracker issue per (PR, bot) pair — updated in place when the
# same bot posts again on the same PR. A new (PR, bot) combination
# opens a new issue.

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  file-finding:
    # Only fire when:
    #   * the author is a known review bot (declared in KNOWN_BOTS below), and
    #   * for issue_comment events, the comment is on a PR (not an issue).
    if: |
      github.event.sender.type == 'Bot' &&
      contains(
        fromJSON('["github-advanced-security[bot]","coderabbitai[bot]","greptile[bot]","qodo-merge[bot]"]'),
        github.event.sender.login
      ) &&
      (
        github.event_name != 'issue_comment' ||
        github.event.issue.pull_request != null
      )
    runs-on: ubuntu-latest
    steps:
      - name: Open or update tracker issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sender = context.payload.sender.login;
            const eventName = context.event_name;

            // Pull PR + comment metadata out of whichever event fired.
            const prPayload = context.payload.pull_request
              || context.payload.issue
              || (context.payload.review && context.payload.review.pull_request_url && {
                  number: Number(context.payload.review.pull_request_url.split('/').pop()),
                });
            if (!prPayload || !prPayload.number) {
              core.warning('Could not determine PR number from event; aborting.');
              return;
            }
            const prNumber = prPayload.number;
            const prTitle = prPayload.title || '';
            const prUrl = prPayload.html_url || `${context.serverUrl}/${owner}/${repo}/pull/${prNumber}`;
            const prBranch = prPayload.head && prPayload.head.ref
              || context.payload.pull_request && context.payload.pull_request.head.ref
              || '';
            const prSha = (prPayload.head && prPayload.head.sha)
              || (context.payload.pull_request && context.payload.pull_request.head.sha)
              || context.payload.comment && context.payload.comment.commit_id
              || '';
            const prAuthor = (prPayload.user && prPayload.user.login)
              || (context.payload.pull_request && context.payload.pull_request.user && context.payload.pull_request.user.login)
              || 'unknown';

            // The actual finding content.
            const comment = context.payload.comment || context.payload.review || {};
            const findingPath = comment.path || '';
            const findingLine = (comment.line != null) ? comment.line : (comment.original_line != null ? comment.original_line : null);
            const findingUrl = comment.html_url || '';
            const findingState = (context.payload.review && context.payload.review.state) || 'commented';
            const findingBody = (comment.body || '').trim();

            const safeBody = findingBody.length > 4000
              ? findingBody.slice(0, 4000) + '\n\n…(truncated; see source link)…'
              : findingBody;

            const triggerMarker = '<!-- review-tracker -->';
            const runMarker = `<!-- review-tracker:bot=${sender}:pr=${prNumber} -->`;

            // Find an existing open tracker for this (bot, PR) pair.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const tracker = issues.find(i => i.body && i.body.includes(runMarker));

            const header = [
              triggerMarker,
              runMarker,
              `## 🤖 ${sender} finding on PR #${prNumber}`,
              '',
              '| Field | Value |',
              '|---|---|',
              `| PR | [#${prNumber} — ${prTitle}](${prUrl}) |`,
              `| Bot | @${sender} |`,
              `| Review state | \`${findingState}\` |`,
              `| PR author | @${prAuthor} |`,
              `| Branch | \`${prBranch}\` |`,
              `| Commit | \`${(prSha || '').substring(0, 7)}\` |`,
              findingPath ? `| File | \`${findingPath}${findingLine ? `#L${findingLine}` : ''}\` |` : '',
              `| Trigger | \`${eventName}\` |`,
              '',
              findingUrl ? `🔗 [Open the original comment](${findingUrl})` : '',
              '',
              '### Finding excerpt',
              '',
              safeBody ? '```\n' + safeBody + '\n```' : '_No body text._',
              '',
              '---',
              '_Auto-opened by the Review Findings → Issue workflow._',
              '_Subsequent findings from the same bot on the same PR append to this issue._',
            ].filter(Boolean).join('\n');

            if (tracker) {
              // Append the new finding below the previous one(s) — preserves history.
              const sep = '\n\n---\n\n';
              const newBody = tracker.body + sep + header;
              await github.rest.issues.update({
                owner, repo, issue_number: tracker.number, body: newBody,
              });
              core.info(`Appended new finding to tracker issue #${tracker.number}.`);
              return;
            }

            const labels = ['review-finding', 'bot-review'];
            // Add a bot-specific label if it doesn't exist (GitHub creates
            // labels on first apply).
            labels.push(`bot:${sender.replace(/\[bot\]$/, '')}`);

            const title = `🤖 ${sender} — ${prTitle} (#${prNumber})`;
            const { data: issue } = await github.rest.issues.create({
              owner, repo, title, body: header, labels,
            });
            core.info(`Opened new tracker issue #${issue.number}.`);