name: SonarQube Community

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  sonarqube-community:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/api/system/status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SONAR_SCANNER_VERSION: 6.2.1.4610
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for SonarQube
        run: |
          for i in {1..180}; do
            body=$(curl -s http://127.0.0.1:9000/api/system/status || echo "")
            if echo "$body" | grep -q '"status":"UP"'; then
              echo "SonarQube UP after ${i} attempts"
              break
            fi
            echo "Waiting for SonarQube ($i/180)..."
            sleep 5
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check backend
        working-directory: backend
        run: cargo check

      - uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://sonarqube:9000
        with:
          scannerVersion: ${{ env.SONAR_SCANNER_VERSION }}
          args: >
            -Dsonar.projectKey=whiteboard
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.language=multi-language
