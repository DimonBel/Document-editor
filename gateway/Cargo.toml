[package]
name = "gateway"
version.workspace = true
edition.workspace = true
description = "Rust gateway: auth, reverse-proxy, WS proxy, rate-limit, idempotency, correlation, RabbitMQ->SSE."

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
ed-domain = { workspace = true }
ed-contracts = { workspace = true }
ed-errors = { workspace = true }
ed-observability = { workspace = true }
ed-auth = { workspace = true }
ed-cache = { workspace = true }
ed-messaging-rabbitmq = { workspace = true }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
http = { workspace = true }
http-body-util = "0.1"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.24" }
futures = { workspace = true }
futures-util = "0.3"

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = { workspace = true }
async-trait = { workspace = true }
lapin = { workspace = true }
deadpool-redis = { workspace = true }
redis = { workspace = true }
parking_lot = { workspace = true }
async-stream = "0.3"
pin-project-lite = "0.2"
url = "2.5"
argon2 = "0.5"
subtle = "2.6"
rsa = { version = "0.9", features = ["sha2"] }
bytes = "1"
anyhow = "1"
