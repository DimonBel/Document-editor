[package]
name = "latex-service"
version.workspace = true
edition.workspace = true
description = "LaTeX compiler + DOCX writer. Composes ed-* packages."

[[bin]]
name = "latex-service"
path = "src/main.rs"

[dependencies]
ed-domain = { workspace = true }
ed-contracts = { workspace = true }
ed-errors = { workspace = true, features = ["axum"] }
ed-observability = { workspace = true }
ed-auth = { workspace = true }
ed-cache = { workspace = true }
ed-persistence-postgres = { workspace = true }
ed-persistence-mongo = { workspace = true }
ed-messaging-rabbitmq = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
zip = { workspace = true }
deadpool-redis = { workspace = true }
sqlx = { workspace = true }
