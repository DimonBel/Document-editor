server {
    listen 80;

    # Issue #244: defense-in-depth security headers. The SPA renders
    # user-controlled content (LaTeX preview, CodeMirror, Konva canvas),
    # so these are essential.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://gateway" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Issue #244: allow 2 MiB upload (gateway enforces its own 1 MiB cap
    # via MAX_SOURCE_BYTES / request limits).
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.0;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    location /ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}