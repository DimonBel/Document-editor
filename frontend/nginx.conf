map $http_upgrade $limited_upgrade {
    default "";
    websocket websocket;
}

map $limited_upgrade $connection_upgrade {
    default close;
    websocket upgrade;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Defence against h2c smuggling: explicitly drop any
        # client-supplied Upgrade / Connection headers before they
        # reach the backend, and stay on HTTP/1.0 so the backend
        # never sees an HTTP/2 upgrade offer.
        proxy_http_version 1.0;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $limited_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
